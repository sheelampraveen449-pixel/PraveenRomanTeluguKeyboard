name: Android Keyboard APK Build

on:
  push:
    branches:
      - keyboard-batch9-offline-correction-20261119
    paths:
      - "roman-keyboard/**"
      - ".github/workflows/android-keyboard-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Roman Telugu Keyboard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Build debug APK
        working-directory: roman-keyboard
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roman-telugu-keyboard-debug-apk
          path: roman-keyboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
