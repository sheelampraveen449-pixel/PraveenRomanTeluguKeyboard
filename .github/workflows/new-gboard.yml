name: NEW GBOARD - AOSP LatinIME

on:
  push:
    branches:
      - NEW-GBOARD
    paths:
      - ".gitmodules"
      - "NEW-GBOARD/**"
      - ".github/workflows/new-gboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NEW GBOARD and complete AOSP source
        uses: actions/checkout@v4
        with:
          ref: NEW-GBOARD
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.1.8937393"

      - name: Adapt AOSP source as standalone NEW GBOARD
        run: |
          python3 NEW-GBOARD/scripts/prepare_standalone.py
          chmod +x NEW-GBOARD/LatinIME/gradlew
          test -f NEW-GBOARD/LatinIME/gradle/wrapper/gradle-wrapper.jar
          grep -q "applicationId 'com.praveen.newgboard'" NEW-GBOARD/LatinIME/build.gradle
          grep -q '>NEW GBOARD</string>' NEW-GBOARD/LatinIME/java/res/values/strings-appname.xml

      - name: Run unit tests and build APK
        working-directory: NEW-GBOARD/LatinIME
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.1.8937393
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify APK package and input-method service
        id: apk
        working-directory: NEW-GBOARD/LatinIME
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          aapt dump badging "$APK" | grep -q "package: name='com.praveen.newgboard'"
          aapt dump xmltree "$APK" AndroidManifest.xml | grep -q "android.view.InputMethod"
          mkdir -p ../../artifacts
          cp "$APK" ../../artifacts/NEW-GBOARD-debug.apk
          sha256sum ../../artifacts/NEW-GBOARD-debug.apk
          echo "apk_path=artifacts/NEW-GBOARD-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Install and verify IME in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install artifacts/NEW-GBOARD-debug.apk
            adb shell ime enable com.praveen.newgboard/com.android.inputmethod.latin.LatinIME
            adb shell ime set com.praveen.newgboard/com.android.inputmethod.latin.LatinIME
            adb shell ime list -s | grep -q 'com.praveen.newgboard/com.android.inputmethod.latin.LatinIME'
            adb shell dumpsys input_method | grep -q 'com.praveen.newgboard'
            adb shell am start -n com.praveen.newgboard/com.android.inputmethod.latin.setup.SetupActivity
            sleep 3
            adb logcat -d -t 2000 | grep -E 'FATAL EXCEPTION|AndroidRuntime' && exit 1 || true

      - name: Upload NEW GBOARD debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEW-GBOARD-debug-apk
          path: artifacts/NEW-GBOARD-debug.apk
          if-no-files-found: error
          retention-days: 14
